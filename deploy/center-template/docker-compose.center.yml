services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CENTER_SLUG}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - center_net

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ${CENTER_SLUG}_app
    restart: unless-stopped
    env_file:
      - .env.center
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - center_net

networks:
  center_net:

volumes:
  postgres_data:
